<div class="qf-bar flex flex-wrap items-center">
  @for (item of items(); track item.key) {
    @if (item.kind === 'chip') {
      @if (item.chip.key === editingKey()) {
        <ng-container [ngTemplateOutlet]="inlineTpl" />
      } @else {
        <app-qf-chip
          [chip]="item.chip"
          [selected]="item.chip.key === selectedKey()"
          (activate)="chipActivate.emit(item.chip)"
        />
      }
    } @else if (isActiveCaret(item.caret)) {
      <ng-container [ngTemplateOutlet]="inlineTpl" />
    } @else {
      <button
        type="button"
        class="qf-caret"
        aria-label="Insert here"
        (click)="caretActivate.emit(item.caret)"
      ></button>
    }
  }

  @if (!stream().chips.length) {
    <span class="qf-placeholder text-gray-400">Click to add a filter…</span>
  }
</div>

<ng-template #inlineTpl>
  <input
    #inlineEl
    type="text"
    class="qf-caret-input"
    autocomplete="off"
    spellcheck="false"
    aria-label="Type a field, logical operator or ("
    [value]="draft()"
    [attr.size]="draft().length || 1"
    (input)="inlineInput.emit(inlineEl.value)"
    (keydown)="inlineKeydown.emit($event)"
    (blur)="inlineBlur.emit()"
  />
</ng-template>
