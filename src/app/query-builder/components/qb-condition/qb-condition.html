<article class="flex flex-row gap-3 leading-[32px] px-5 py-3 mb-4">
  <div>
    <mat-form-field>
      <mat-label>Field</mat-label>
      <input
        [formField]="form().field_name"
        matInput
        type="text"
      />
    </mat-form-field>
  </div>

  <div>
    Operator: {{ form().operator().value() }}
  </div>

  <div>
    Value
  </div>
</article>
