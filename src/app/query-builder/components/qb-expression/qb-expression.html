<article class="flex flex-col gap-3">
  <header class="flex flex-row pt-1 gap-3">
    <!-- operator -->
    <mat-button-toggle-group [hideSingleSelectionIndicator]="true">
      <mat-button-toggle class="pl-1">NOT</mat-button-toggle>
      <mat-button-toggle>AND</mat-button-toggle>
      <mat-button-toggle class="pr-1">OR</mat-button-toggle>
    </mat-button-toggle-group>

    <!-- delete expression -->
    <button mat-icon-button><mat-icon>delete</mat-icon></button>
  </header>

  <div class="flex flex-col flex-stretch gap-2">
    <!-- @for expressions -->
    <app-qb-condition />

    <div class="flex flex-row">
      Expression: Recursive
    </div>
  </div>
</article>
