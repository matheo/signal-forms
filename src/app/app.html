<mat-card class="container my-12">
  <mat-card-header class="text-2xl mb-3">
    <h1>Query Builder Experiment</h1>
  </mat-card-header>

  <mat-card-content class="!pb-1">
    <app-query-filters [filters]="filters()" [(model)]="model" />

    <div class="my-5"></div>

    <app-query-builder [filters]="filters()" [(model)]="model" />
  </mat-card-content>

  <mat-card-footer class="p-4 pt-2">
    <pre>{{ model() | json }}</pre>
  </mat-card-footer>
</mat-card>
